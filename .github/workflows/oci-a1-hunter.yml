name: OCI Always Free A1 capacity hunter

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: oci-a1-capacity-hunter
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
      OCI_SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_API_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
    steps:
      - name: Checkout provisioning script
        uses: actions/checkout@v4
      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check 'oci>=2.140,<3'
      - name: Attempt Always Free launch
        run: python scripts/oci_a1_hunter.py

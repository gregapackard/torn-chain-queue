name: OCI Always Free A1 capacity hunter

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: oci-a1-capacity-hunter
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
      OCI_SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_API_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
    steps:
      - name: Checkout provisioning script
        uses: actions/checkout@v4
      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check 'oci>=2.140,<3'
      - name: Attempt Always Free launch
        id: launch
        run: python scripts/oci_a1_hunter.py
      - name: Notify repository owner through GitHub issue
        if: steps.launch.outputs.provisioned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/oci-success.md <<EOF
          Oracle Cloud accepted or detected the Chain Queue instance.

          **Instance OCID:** \`$INSTANCE_ID\`
          **Shape:** VM.Standard.A1.Flex (2 OCPU, 12 GB RAM)
          **Workflow run:** $RUN_URL

          Next: confirm the instance reaches RUNNING, then deploy and verify the latest Chain Queue before switching traffic.
          The capacity-hunter workflow is configured to disable itself after this run.

          This issue is assigned to the repository owner to generate a GitHub notification; email delivery depends on the owner's GitHub notification settings.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "OCI Chain Queue instance provisioned — migration ready" \
            --body-file /tmp/oci-success.md \
            --assignee "${GITHUB_REPOSITORY_OWNER}"
      - name: Disable capacity hunter after successful provisioning
        if: steps.launch.outputs.provisioned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "OCI instance accepted or already exists: ${{ steps.launch.outputs.instance_id }}"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/oci-a1-hunter.yml/disable"
          echo "Disabled future scheduled capacity-hunter runs."

